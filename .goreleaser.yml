version: 2

project_name: envc

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: envc
    main: ./cmd/envc
    binary: envc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# Linux only: UPX shrinks ELF; skip darwin/windows (signing / compatibility).
# See https://goreleaser.com/customization/builds/upx/
upx:
  - enabled: true
    ids: [envc]
    goos: [linux]
    compress: best
    lzma: true

archives:
  - id: envc
    ids: [envc]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^build:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## go-config `{{ .Tag }}`

    Install the `envc` CLI:

    ```sh
    go install github.com/eslider/go-config/cmd/envc@{{ .Tag }}
    ```

    Or download a prebuilt binary below.
  footer: |
    **Full Changelog**: https://github.com/eSlider/go-config/compare/{{ .PreviousTag }}...{{ .Tag }}
